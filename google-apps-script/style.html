<style>
/* Pakistan Runner */
:root {
  --green: #0b3d2e;
  --green-2: #14644a;
  --pk: #01411c;
  --gold: #f4c542;
  --gold-2: #d4a017;
  --ink: #10201a;
  --paper: #fffaf0;
  --muted: #6d7a73;
  --glass: rgba(9, 32, 25, 0.72);
  --native: "Noto Naskh Arabic", "Geeza Pro", "Segoe UI", Tahoma, Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #06251c; color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }
.native { font-family: var(--native); }

/* ───────── HUD ───────── */
#hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
.hud-top {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top)) 10px 0;
}
.hud-side { display: flex; flex-direction: column; gap: 6px; min-width: 84px; }
.hud-side.right { align-items: flex-end; }
.pill {
  background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px;
  padding: 5px 12px; font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 6px;
  backdrop-filter: blur(6px); width: fit-content;
}
#hearts { color: #ff5a7a; letter-spacing: 2px; font-size: 17px; }
#hearts .lost { color: rgba(255, 255, 255, 0.28); }
.coin-dot { width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe58a, #d4a017); display: inline-block; }
.icon-btn {
  pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.25);
  background: var(--glass); color: #fff; font-weight: 900; font-size: 13px; cursor: pointer; letter-spacing: 1px;
}
#wordPanel {
  background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 16px;
  padding: 4px 14px 7px; text-align: center; min-width: 170px; max-width: 46vw; backdrop-filter: blur(6px);
}
#wordNative { font-size: 30px; line-height: 1.35; font-weight: 700; color: #fff; }
#wordMeta { font-size: 12.5px; color: #cfeee0; margin-top: -2px; }
#wordMeta b { color: var(--gold); }
#wordSlots { display: flex; justify-content: center; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.slot {
  font-family: var(--native); width: 30px; height: 32px; border-radius: 8px; font-size: 19px; line-height: 30px; font-weight: 700;
  background: rgba(255, 255, 255, 0.1); border: 1.5px dashed rgba(255, 255, 255, 0.4); color: rgba(255, 255, 255, 0.5);
}
.slot.next { border-color: var(--gold); color: #fff; box-shadow: 0 0 0 2px rgba(244, 197, 66, 0.3); }
.slot.got { background: #18a08a; border: 1.5px solid #eafff8; color: #fff; }
#progressWrap {
  position: relative; margin: 8px auto 0; width: min(560px, 86vw); height: 16px; border-radius: 999px;
  background: rgba(0, 0, 0, 0.38); border: 1px solid rgba(255, 255, 255, 0.2); overflow: hidden;
}
#progressBar { height: 100%; width: 0; background: linear-gradient(90deg, #1e8449, #f4c542); }
#sceneLabel { position: absolute; inset: 0; font-size: 10.5px; line-height: 15px; text-align: center; font-weight: 700; letter-spacing: 0.3px; text-shadow: 0 1px 2px #000; }
#toast {
  position: absolute; left: 50%; top: 27%; transform: translateX(-50%); text-align: center; font-weight: 800;
  font-size: clamp(17px, 3.2vw, 26px); text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75); opacity: 0; transition: opacity 0.25s; width: 92vw;
}
#toast.on { opacity: 1; }
#toast .native { font-size: 1.5em; display: block; line-height: 1.4; }
#toast small { display: block; font-size: 0.62em; font-weight: 600; opacity: 0.95; }
#toast.bad { color: #ffd0d0; }
#toast.gold { color: #ffe9a3; }
#cameoCard {
  position: absolute; left: 10px; bottom: calc(14px + env(safe-area-inset-bottom)); max-width: min(360px, 78vw);
  background: var(--paper); color: var(--ink); border-radius: 14px; padding: 9px 12px; border-left: 6px solid var(--pk);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); font-size: 13px; line-height: 1.35;
}
#cameoCard .k { font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; color: var(--pk); text-transform: uppercase; }
#cameoCard .n { font-size: 16px; font-weight: 800; }
#cameoCard .g { margin-top: 4px; font-weight: 800; color: #b8590c; }
#fxOverlay { position: fixed; inset: 0; pointer-events: none; transition: box-shadow 0.3s, background 0.3s; }
#fxOverlay.slow { background: rgba(120, 200, 255, 0.13); }
#fxOverlay.danger { box-shadow: inset 0 0 120px 20px rgba(255, 0, 40, 0.35); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: inset 0 0 90px 10px rgba(255, 0, 40, 0.22); } }
#powers { position: absolute; right: 10px; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.pw { position: relative; overflow: hidden; min-width: 128px; background: var(--glass); border: 2px solid var(--c); border-radius: 12px; padding: 4px 10px 7px; font-size: 12.5px; font-weight: 800; }
.pw i { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--c); }
#hint {
  position: absolute; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--glass); border-radius: 12px;
  padding: 8px 14px; font-size: 14px; font-weight: 600; text-align: center; width: max-content; max-width: 90vw;
}

/* ───────── Screens ───────── */
#screens { position: fixed; inset: 0; pointer-events: none; }
.screen {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto;
  background: rgba(4, 20, 15, 0.55); padding: 12px; overflow: auto; touch-action: pan-y;
}
.card {
  background: var(--paper); border-radius: 22px; padding: 20px 22px; width: min(560px, 100%); max-height: 100%;
  overflow: auto; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5); border-top: 8px solid var(--green-2);
}
.card.small { width: min(380px, 100%); text-align: center; }
.card.wide { width: min(860px, 100%); }
.card h1 { margin: 6px 0 0; font-size: clamp(30px, 6vw, 44px); color: var(--green); letter-spacing: -0.5px; }
.card h2 { margin: 2px 0 8px; font-size: clamp(19px, 3.6vw, 25px); color: var(--green-2); }
.card h3 { margin: 14px 0 6px; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.card p { margin: 6px 0; line-height: 1.5; font-size: 15.5px; }
.title-card { text-align: center; }
.crest { width: 70px; height: 70px; margin: 0 auto; border-radius: 50%; background: var(--pk); position: relative; box-shadow: 0 0 0 5px #fff, 0 0 0 8px var(--gold); }
.crest::before { content: ""; position: absolute; left: 16px; top: 14px; width: 40px; height: 40px; border-radius: 50%; background: #fff; }
.crest::after { content: ""; position: absolute; left: 25px; top: 11px; width: 36px; height: 36px; border-radius: 50%; background: var(--pk); }
.crest span { position: absolute; left: 42px; top: 20px; width: 11px; height: 11px; background: #fff; z-index: 2; clip-path: polygon(50% 0, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 76%, 20% 100%, 30% 60%, 0 38%, 38% 36%); }
.tag { font-weight: 700; color: var(--ink); }
.muted { color: var(--muted); font-size: 14px !important; }
.fact { background: #eef7f0; border-radius: 12px; padding: 9px 12px; font-size: 13.5px !important; color: #24513f; margin-top: 12px !important; }
.credits { font-size: 11.5px !important; color: var(--muted); margin-top: 10px !important; }
.btn-col { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.btn-row { display: flex; gap: 8px; }
/* keep the main buttons in reach when a card is taller than the screen */
#introCard > .btn-col, #outroCard > .btn-col, #msgCard > .btn-col {
  position: sticky; bottom: -22px; margin: 14px -4px -6px; padding: 10px 4px 16px;
  background: linear-gradient(180deg, rgba(255, 250, 240, 0), var(--paper) 22%);
}
.btn-row .btn { flex: 1; }
.btn {
  font: inherit; font-weight: 800; font-size: 16px; padding: 12px 14px; border-radius: 14px; border: 2px solid #d9d2c0;
  background: #fff; color: var(--ink); cursor: pointer; transition: transform 0.06s;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: linear-gradient(180deg, #ffd65a, #f0b21e); border-color: #c98f0c; color: #3a2a00; }
.btn.green { background: linear-gradient(180deg, #1e8449, #01411c); border-color: #01411c; color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--green-2); font-size: 14.5px; padding: 8px; }
.btn.big { font-size: 26px; padding: 20px; width: 100%; }
.btn:disabled { opacity: 0.5; cursor: default; }

/* scene card */
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; color: var(--green-2); }
.scene-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; border-bottom: 2px solid #eadfc6; padding-bottom: 6px; }
.scene-head h2 { margin: 0; color: var(--green); }
.scene-head .native { font-size: clamp(26px, 6vw, 38px); line-height: 1.3; color: var(--pk); font-weight: 700; white-space: nowrap; }
.meta { font-size: 13px !important; color: var(--muted); }
.banner { font-weight: 800; font-size: 17px !important; color: #7a4a00; }
.ref { font-size: 12.5px !important; color: var(--green-2); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: #eef7f0; border: 1px solid #cfe6d8; border-radius: 12px; padding: 4px 10px; font-size: 13px; text-align: center; }
.chip .native { font-size: 21px; line-height: 1.35; display: block; color: var(--pk); font-weight: 700; }
.chip.miss { opacity: 0.45; }
.box { border-radius: 14px; padding: 9px 12px; margin-top: 10px; font-size: 14px; line-height: 1.45; }
.box.cameo { background: #fff3d6; border-left: 6px solid #f0b21e; }
.box.item { background: #e9f5ee; border-left: 6px solid var(--green-2); }
.box.quiet { background: #f1eee8; border-left: 6px solid #a59c8a; }
.box b { display: block; }
.box .k { font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.stats { display: flex; gap: 8px; margin: 10px 0; }
.stat { flex: 1; background: #f3efe4; border-radius: 12px; padding: 8px; text-align: center; font-size: 12px; color: var(--muted); }
.stat b { display: block; font-size: 20px; color: var(--ink); }
.cheer { text-align: center; font-weight: 800; color: var(--green); }
.cheer .native { font-size: 28px; display: block; line-height: 1.4; }

/* lists: scenes, album, shop */
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.tab { font: inherit; font-weight: 800; font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 2px solid #d9d2c0; background: #fff; cursor: pointer; }
.tab.on { background: var(--green-2); color: #fff; border-color: var(--green-2); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { border-radius: 14px; padding: 9px 10px; background: #fff; border: 2px solid #e6dfcc; font-size: 13px; line-height: 1.35; text-align: left; }
button.tile { font: inherit; cursor: pointer; }
.tile .num { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 1px; }
.tile .nm { font-weight: 800; font-size: 14px; display: block; }
.tile .native { font-size: 20px; line-height: 1.4; color: var(--pk); display: block; font-weight: 700; }
.tile.locked { opacity: 0.45; }
.tile.done { border-color: #1e8449; background: #f1faf4; }
.tile.pk { border-left: 6px solid var(--pk); }
.tile.st { border-left: 6px solid var(--gold-2); }
.row-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid #eadfc6; font-size: 14px; }
.row-item small { display: block; color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 74px; border-radius: 12px; border: 2px solid #e6dfcc; background: #fff; padding: 6px; font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; text-align: center; }
.swatch i { display: block; height: 30px; border-radius: 8px; margin-bottom: 4px; }
.swatch.on { border-color: var(--green-2); box-shadow: 0 0 0 3px rgba(20, 100, 74, 0.2); }
.bank { font-weight: 800; background: #fff3d6; border-radius: 999px; padding: 6px 12px; display: inline-flex; gap: 6px; align-items: center; }

/* arm wrestle */
.arm-card { border-top-color: #c0392b; }
#armSvg { width: 100%; height: auto; background: linear-gradient(180deg, #2c3e50, #1a252f); border-radius: 14px; }
.arm-bar { position: relative; height: 18px; border-radius: 999px; background: #c0392b; overflow: hidden; margin: 10px 0 4px; }
#armFill { height: 100%; width: 50%; background: #1e8449; transition: width 0.05s linear; }
.arm-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #fff; }

@media (max-width: 520px) {
  .card { padding: 16px 15px; border-radius: 18px; }
  .card p { font-size: 14.5px; }
  #wordNative { font-size: 24px; }
  #wordPanel { max-width: 54vw; min-width: 0; padding: 3px 8px 6px; }
  #wordSlots { gap: 3px; }
  .slot { width: 22px; height: 26px; font-size: 15px; line-height: 24px; border-radius: 6px; }
  .pill { font-size: 13px; padding: 4px 9px; }
  .hud-side { min-width: 64px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); }
}
@media (max-height: 520px) {
  .card { padding: 12px 16px; }
  .card p { font-size: 13.5px; margin: 4px 0; }
  .crest { display: none; }
}

</style>
